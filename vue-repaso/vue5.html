<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <p v-if="isTarefas()">Hay {{num}} tarefas pendentes</p>
      <p v-else>Non hay tarefas pendentes</p>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
      const { createApp } = Vue;
      createApp({
        data() {
          return {
            tarefas: ['tarefa1', 'tarefa2'],
            num: 0,
          };
        },
        methods: {
          isTarefas() {
            this.num = this.tarefas.length;
            return this.tarefas.length > 0;
          },
        },
      }).mount('#app');
    </script>
  </body>
  <style></style>
</html>
