<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />

    <title>Our superheroes</title>

    <link
      href="https://fonts.googleapis.com/css?family=Faster+One"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="heroes.css" />
  </head>

  <body>
    <header></header>

    <section></section>

    <script>
      const xhr = new XMLHttpRequest();
      xhr.open(
        "GET",
        "https://mdn.github.io/learning-area/javascript/oojs/json/superheroes.json",
      );
      xhr.send();

      xhr.addEventListener("load", () => {
        //OBTER INFORMACION DA API
        const obxectoJSON = JSON.parse(xhr.response);
        const squadName = obxectoJSON.squadName;
        const homeTown = obxectoJSON.homeTown;
        const formed = obxectoJSON.formed;
        const members = obxectoJSON.members;

        //AÑADIR INFO A PAXINA
        const header = document.querySelector("header");
        const h1 = document.createElement("h1");
        const p = document.createElement("p");
        const section = document.querySelector("section");

        header.append(h1);
        h1.append(squadName);
        header.append(p);
        p.append("Hometown: " + homeTown + " // Formed: " + formed);

        members.forEach((member) => {
          //OBTER INFO DA API
          const name = member.name;
          const identity = member.secretIdentity;
          const age = member.age;
          const powers = member.powers;

          //CREAR ELEMENTOS DO DOM NECESARIOS
          const article = document.createElement("article");
          const h2 = document.createElement("h2");
          const p = document.createElement("p");
          const p2 = document.createElement("p");
          const p3 = document.createElement("p");
          const ul = document.createElement("ul");

          //AÑADIR ELEMENTOS E INFO A PAXINA
          section.append(article);
          article.append(h2);
          h2.append(name);
          article.append(p);
          p.append("Secret identity: " + identity);
          article.append(p2);
          p2.append("Age: " + age);
          article.append(p3);
          p3.append("Superpowers: ");
          article.append(ul);

          powers.forEach((power) => {
            const li = document.createElement("li");
            ul.append(li);
            li.append(power);
          });
        });
      });
    </script>
  </body>
</html>
